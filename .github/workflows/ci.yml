---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Test release integrity logic
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "guard") | .version')
          verify_tag() { test "$1" = "v${version}"; }
          verify_tag "v${version}"
          if verify_tag "v0.0.0"; then
            echo "mismatched release tag was accepted"
            exit 1
          fi
          mkdir -p /tmp/guard-release-test/a /tmp/guard-release-test/b /tmp/guard-release-test/c
          printf one > /tmp/guard-release-test/a/one.tar.gz
          printf two > /tmp/guard-release-test/b/two.tar.gz
          printf sbom > /tmp/guard-release-test/c/three.cdx.json
          printf skip > /tmp/guard-release-test/c/notes.txt
          find /tmp/guard-release-test -type f \( -name '*.tar.gz' -o -name '*.cdx.json' \) -print \
            | LC_ALL=C sort | while IFS= read -r asset; do
            checksum=$(sha256sum "$asset" | cut -d ' ' -f 1)
            printf '%s  %s\n' "$checksum" "$(basename "$asset")"
          done > /tmp/guard-release-test/SHA256SUMS
          test -s /tmp/guard-release-test/SHA256SUMS
          test "$(wc -l < /tmp/guard-release-test/SHA256SUMS)" -eq 3
          if grep -q 'notes.txt' /tmp/guard-release-test/SHA256SUMS; then
            echo "checksum manifest included an unexpected file type"
            exit 1
          fi
          release_job=$(sed -n '/^  release:/,$p' .github/workflows/publish-release.yml)
          checkout_line=$(printf '%s\n' "$release_job" | grep -n -m1 'uses: actions/checkout@' | cut -d: -f1)
          create_line=$(printf '%s\n' "$release_job" | grep -n -m1 'name: Create Release' | cut -d: -f1)
          test -n "$checkout_line"
          test -n "$create_line"
          test "$checkout_line" -lt "$create_line"
          printf '%s\n' "$release_job" | grep -A3 -m1 'uses: actions/checkout@' | grep -q 'persist-credentials: false'
          printf '%s\n' "$release_job" | grep -A4 -m1 'uses: actions/checkout@' | grep -q 'fetch-depth: 0'
          mkdir /tmp/guard-release-test/verify
          cp /tmp/guard-release-test/a/*.tar.gz /tmp/guard-release-test/b/*.tar.gz /tmp/guard-release-test/verify/
          cp /tmp/guard-release-test/c/*.cdx.json /tmp/guard-release-test/verify/
          cp /tmp/guard-release-test/SHA256SUMS /tmp/guard-release-test/verify/
          (cd /tmp/guard-release-test/verify && sha256sum --check SHA256SUMS)
          rm -rf /tmp/guard-release-test

      - name: Exercise packaged systemd argument expansion
        if: runner.os == 'Linux'
        shell: bash
        run: sudo ./deployment/systemd/test-guard-service-expansion.sh

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          components: clippy, rustfmt
          cache: false
          rustflags: ""

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: test
          cache-workspace-crates: true
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Rustfmt check
        run: cargo fmt --all -- --check

      - name: Fuzz manifest lock check
        run: cargo metadata --manifest-path fuzz/Cargo.toml --locked --no-deps --format-version 1

      - name: User-facing style check
        shell: bash
        run: |
          em_dash=$(printf '\342\200\224')
          if git grep -n "$em_dash"; then
            echo "Em dash characters are not permitted in repository content."
            exit 1
          fi

      - name: Clippy lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

  adversarial_gate:
    name: Credential-free adversarial gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Run isolated adversarial gate
        shell: bash
        run: ./ctf/gating/run.sh attack

  synthetic_user:
    name: Isolated synthetic-user catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Install rootless Podman
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman uidmap slirp4netns fuse-overlayfs
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
      - name: Run isolated synthetic-user catalog
        shell: bash
        env:
          CONTAINER_ENGINE: podman
        run: ./ctf/gating/run.sh synthetic-user

  release_validation:
    name: Required release package validation
    uses: ./.github/workflows/release.yml
    permissions:
      contents: read

  # Branch protection requires a status check literally named "Test & Lint".
  # The matrix job above reports as "Test & Lint (ubuntu-latest)" / "Test &
  # Lint (windows-latest)" instead, so that required context could never be
  # satisfied. This aggregator job produces the exact required name and fails
  # if any matrix leg did not succeed, so the repository ruleset can require one
  # stable check regardless of how many OSes the matrix covers.
  test_and_lint:
    name: Test & Lint
    needs: [test, adversarial_gate, synthetic_user, release_validation, build_dry_run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        env:
          TEST_RESULT: ${{ needs.test.result }}
          ADVERSARIAL_RESULT: ${{ needs.adversarial_gate.result }}
          SYNTHETIC_USER_RESULT: ${{ needs.synthetic_user.result }}
          RELEASE_VALIDATION_RESULT: ${{ needs.release_validation.result }}
          BUILD_RESULT: ${{ needs.build_dry_run.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ]; then
            echo "Test & Lint matrix did not succeed: $TEST_RESULT"
            exit 1
          fi
          if [ "$ADVERSARIAL_RESULT" != "success" ]; then
            echo "Credential-free adversarial gate did not succeed: $ADVERSARIAL_RESULT"
            exit 1
          fi
          if [ "$SYNTHETIC_USER_RESULT" != "success" ]; then
            echo "Isolated synthetic-user catalog did not succeed: $SYNTHETIC_USER_RESULT"
            exit 1
          fi
          if [ "$RELEASE_VALIDATION_RESULT" != "success" ]; then
            echo "Release package validation did not succeed: $RELEASE_VALIDATION_RESULT"
            exit 1
          fi
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "Required platform builds did not succeed: $BUILD_RESULT"
            exit 1
          fi

  build_dry_run:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: guard
          # Dry-runs the cross-compiled release target so aarch64 breakage
          # surfaces on pull requests instead of at tag time. Mirrors the
          # cross usage in release.yml.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary: guard
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: guard
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: guard.exe
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          target: ${{ matrix.target }}
          cache: false
          rustflags: ""

      - name: Identify build environment
        id: build-environment
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          GIT_SHA: ${{ github.sha }}
          WORKFLOW_HASH: ${{ hashFiles('.github/workflows/ci.yml') }}
        run: |
          rustc_commit=$(rustc -vV | awk '/^commit-hash:/ { print $2 }')
          runner_image="${ImageOS:-unknown}-${ImageVersion:-unknown}"
          printf 'cache_key=binary-v1-%s-%s-%s-%s-%s\n' \
            "$BUILD_TARGET" "$rustc_commit" "$runner_image" "$WORKFLOW_HASH" "$GIT_SHA" \
            >> "$GITHUB_OUTPUT"

      # build.rs embeds the Git commit in the executable. A binary is therefore
      # reusable only for an exact rerun with the same toolchain and runner image.
      - name: Restore exact binary
        id: binary-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          key: ${{ steps.build-environment.outputs.cache_key }}

      - name: Rust Cache
        if: steps.binary-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: release-${{ matrix.target }}
          cache-workspace-crates: true
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Install Cross
        if: matrix.use_cross && steps.binary-cache.outputs.cache-hit != 'true'
        run: cargo install cross --version 0.2.5 --locked

      - name: Build
        if: ${{ !matrix.use_cross && steps.binary-cache.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cargo build --release --target "$BUILD_TARGET"

      - name: Build (Cross)
        if: matrix.use_cross && steps.binary-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cross build --release --target "$BUILD_TARGET"

      - name: Save exact binary
        if: >-
          steps.binary-cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          key: ${{ steps.binary-cache.outputs.cache-primary-key }}

      - name: Verify binary
        shell: bash
        env:
          BINARY: target/${{ matrix.target }}/release/${{ matrix.binary }}
          USE_CROSS: ${{ matrix.use_cross }}
        run: |
          if [ "$USE_CROSS" = "true" ]; then
            # The cross-compiled binary cannot execute on the host runner;
            # confirm it exists and targets the expected architecture.
            file "$BINARY"
            file "$BINARY" | grep -q aarch64
          else
            "$BINARY" --version
          fi
