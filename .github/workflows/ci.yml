---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Test release publication
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/test-publish-release.sh

      - name: Test release archive comparison diagnostics
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/build-release-archive.sh --test-archive-comparison

      - name: Test systemd integration invocation contract
        if: runner.os == 'Linux'
        shell: bash
        run: ./deployment/systemd/test-guard-service-expansion.sh --self-test

      - name: Verify systemd unit files
        if: runner.os == 'Linux'
        shell: bash
        run: ./deployment/systemd/test-guard-service-expansion.sh --verify-only

      - name: Fault-inject Unix upgrade and rollback
        if: runner.os == 'Linux'
        shell: bash
        run: ./deployment/systemd/test-upgrade-guard.sh

      - name: Test Windows installer contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0.0 -ErrorAction Stop
          Invoke-Pester -Path deployment/windows/install-guard.Tests.ps1 -CI

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          components: clippy, rustfmt
          cache: false
          rustflags: ""

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: test
          cache-workspace-crates: true
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Rustfmt check
        run: cargo fmt --all -- --check

      - name: Fuzz manifest lock check
        run: cargo metadata --manifest-path fuzz/Cargo.toml --locked --no-deps --format-version 1

      - name: User-facing style check
        shell: bash
        run: |
          em_dash=$(printf '\342\200\224')
          if git grep -n "$em_dash"; then
            echo "Em dash characters are not permitted in repository content."
            exit 1
          fi

      - name: Clippy lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features

  adversarial_gate:
    name: Fixed-identity adversarial gate
    runs-on: ubuntu-latest
    # The harness also bounds its build and attack phases so this remains a
    # final containment boundary rather than the usual failure path.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run isolated adversarial gate
        shell: bash
        env:
          CTF_BUILD_TIMEOUT_SECS: "1200"
          CTF_ATTACK_TIMEOUT_SECS: "300"
          CTF_CLEANUP_TIMEOUT_SECS: "20"
          CTF_DIAGNOSTIC_TIMEOUT_SECS: "5"
          CTF_DIAGNOSTIC_DIR: ${{ runner.temp }}/guard-adversarial-diagnostics
        run: |
          python3 ./ctf/egress-proxy.py --self-test
          ./ctf/gating/run.sh static
          ./ctf/gating/run.sh attack
      - name: Upload sanitized adversarial diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fixed-identity-adversarial-diagnostics
          path: ${{ runner.temp }}/guard-adversarial-diagnostics/summary.txt
          if-no-files-found: warn
          retention-days: 7

  synthetic_user:
    name: Isolated synthetic-user catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install rootless Podman
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman uidmap slirp4netns fuse-overlayfs
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
      - name: Run isolated synthetic-user catalog
        shell: bash
        env:
          CONTAINER_ENGINE: podman
        run: ./ctf/gating/run.sh synthetic-user
      - name: Upload synthetic-user diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: synthetic-user-diagnostics
          path: |
            .cache/synthetic-user/status.md
            .cache/synthetic-user/latest-run
            .cache/synthetic-user/runs/*/manifest.md
            .cache/synthetic-user/runs/*/source-files.sha256
            .cache/synthetic-user/runs/*/scenarios/*.md
          if-no-files-found: warn
          retention-days: 7

  release_validation:
    name: Required release package validation
    uses: ./.github/workflows/release.yml
    permissions:
      actions: read  # Let release validation inspect mainline workflow runs.
      checks: read  # Let release validation verify required check results.
      contents: read  # Let release validation inspect signed refs and commits.

  # Branch protection requires a status check literally named "Test & Lint".
  # The matrix job above reports as "Test & Lint (ubuntu-latest)" / "Test &
  # Lint (windows-latest)" instead, so that required context could never be
  # satisfied. This aggregator job produces the exact required name and fails
  # if any matrix leg did not succeed, so the repository ruleset can require one
  # stable check regardless of how many OSes the matrix covers.
  test_and_lint:
    name: Test & Lint
    needs: [test, adversarial_gate, synthetic_user, release_validation, build_dry_run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        env:
          TEST_RESULT: ${{ needs.test.result }}
          ADVERSARIAL_RESULT: ${{ needs.adversarial_gate.result }}
          SYNTHETIC_USER_RESULT: ${{ needs.synthetic_user.result }}
          RELEASE_VALIDATION_RESULT: ${{ needs.release_validation.result }}
          BUILD_RESULT: ${{ needs.build_dry_run.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ]; then
            echo "Test & Lint matrix did not succeed: $TEST_RESULT"
            exit 1
          fi
          if [ "$ADVERSARIAL_RESULT" != "success" ]; then
            echo "Fixed-identity adversarial gate did not succeed: $ADVERSARIAL_RESULT"
            exit 1
          fi
          if [ "$SYNTHETIC_USER_RESULT" != "success" ]; then
            echo "Isolated synthetic-user catalog did not succeed: $SYNTHETIC_USER_RESULT"
            exit 1
          fi
          if [ "$RELEASE_VALIDATION_RESULT" != "success" ]; then
            echo "Release package validation did not succeed: $RELEASE_VALIDATION_RESULT"
            exit 1
          fi
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "Required platform builds did not succeed: $BUILD_RESULT"
            exit 1
          fi

  ci_build_targets:
    name: Resolve CI build targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Extend release targets with the CI-only macOS build
        id: targets
        shell: bash
        run: |
          matrix=$(bash scripts/build-release-archive.sh --matrix-json | jq -c \
            '.include += [{
              target: "aarch64-apple-darwin",
              os: "macos-latest",
              artifact_name: "guard",
              use_cross: false
            }]')
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  build_dry_run:
    name: Build (${{ matrix.target }})
    needs: [test, ci_build_targets]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJSON(needs.ci_build_targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          target: ${{ matrix.target }}
          cache: false
          rustflags: ""

      - name: Identify build environment
        id: build-environment
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          GIT_SHA: ${{ github.sha }}
          WORKFLOW_HASH: ${{ hashFiles('.github/workflows/ci.yml') }}
        run: |
          rustc_commit=$(rustc -vV | awk '/^commit-hash:/ { print $2 }')
          runner_image="${ImageOS:-unknown}-${ImageVersion:-unknown}"
          printf 'cache_key=binary-v1-%s-%s-%s-%s-%s\n' \
            "$BUILD_TARGET" "$rustc_commit" "$runner_image" "$WORKFLOW_HASH" "$GIT_SHA" \
            >> "$GITHUB_OUTPUT"

      # build.rs embeds the Git commit in the executable. A binary is therefore
      # reusable only for an exact rerun with the same toolchain and runner image.
      - name: Restore exact binary
        id: binary-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          key: ${{ steps.build-environment.outputs.cache_key }}

      - name: Rust Cache
        if: steps.binary-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: release-${{ matrix.target }}
          cache-workspace-crates: true
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Verify release builds use the lockfile
        shell: bash
        run: |
          if rg --pcre2 '^\s+(?:cargo|cross) build(?![^\n]*--locked)(?:\s|$)' .github/workflows/release.yml .github/workflows/ci.yml; then
            echo 'release build command omits --locked' >&2
            exit 1
          fi

      - name: Install Cross
        if: matrix.use_cross && steps.binary-cache.outputs.cache-hit != 'true'
        run: cargo install cross --version 0.2.5 --locked

      - name: Build
        if: ${{ !matrix.use_cross && steps.binary-cache.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "$BUILD_TARGET"

      - name: Build (Cross)
        if: matrix.use_cross && steps.binary-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cross build --locked --release --target "$BUILD_TARGET"

      - name: Save exact binary
        if: >-
          steps.binary-cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          key: ${{ steps.binary-cache.outputs.cache-primary-key }}

      - name: Verify binary
        shell: bash
        env:
          BINARY: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          USE_CROSS: ${{ matrix.use_cross }}
        run: |
          if [ "$USE_CROSS" = "true" ]; then
            # The cross-compiled binary cannot execute on the host runner;
            # confirm it exists and targets the expected architecture.
            file "$BINARY"
            file "$BINARY" | grep -q aarch64
          else
            "$BINARY" --version
          fi
