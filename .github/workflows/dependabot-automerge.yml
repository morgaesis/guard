name: Dependabot review gate

# The required classifier succeeds for valid pull requests that need manual
# review. A separate job records the narrower auto-merge eligibility signal.

"on":
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize

permissions: {}

concurrency:
  group: dependabot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-gate:
    name: Classify dependency update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.policy.outputs.eligible }}
    steps:
      - name: Classify pull request source
        id: source
        run: |
          set -euo pipefail

          event_repository="$(jq -er '.repository.full_name | strings' "$GITHUB_EVENT_PATH")"
          pull_number="$(jq -er '.pull_request.number | numbers' "$GITHUB_EVENT_PATH")"
          pull_author="$(jq -er '.pull_request.user.login | strings' "$GITHUB_EVENT_PATH")"
          pull_state="$(jq -er '.pull_request.state | strings' "$GITHUB_EVENT_PATH")"
          base_ref="$(jq -er '.pull_request.base.ref | strings' "$GITHUB_EVENT_PATH")"
          head_sha="$(jq -er '.pull_request.head.sha | strings' "$GITHUB_EVENT_PATH")"

          if ! [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
            echo "Classification failed: the runtime repository is malformed."
            exit 1
          fi
          if [ "$event_repository" != "$GITHUB_REPOSITORY" ]; then
            echo "Classification failed: the event repository is unexpected."
            exit 1
          fi
          if ! [[ "$pull_number" =~ ^[1-9][0-9]*$ ]] || ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Classification failed: the pull request identity is malformed."
            exit 1
          fi
          if [ "$pull_state" != "open" ] || [ "$base_ref" != "main" ]; then
            echo "Classification failed: the pull request is not open against main."
            exit 1
          fi

          if [ "$pull_author" != "dependabot[bot]" ]; then
            echo "is_dependabot=false" >> "$GITHUB_OUTPUT"
            echo "Manual review required: the pull request is not a Dependabot update."
            exit 0
          fi

          head_repository="$(jq -er '.pull_request.head.repo.full_name | strings' "$GITHUB_EVENT_PATH")"
          if [ "$head_repository" != "$GITHUB_REPOSITORY" ]; then
            echo "Classification failed: the Dependabot head repository is unexpected."
            exit 1
          fi

          echo "is_dependabot=true" >> "$GITHUB_OUTPUT"

      - name: Resolve verified Dependabot metadata
        if: steps.source.outputs.is_dependabot == 'true'
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Classify auto-merge eligibility
        if: always()
        id: policy
        env:
          DIRECTORY: ${{ steps.metadata.outputs.directory }}
          IS_DEPENDABOT: ${{ steps.source.outputs.is_dependabot }}
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          TARGET_BRANCH: ${{ steps.metadata.outputs.target-branch }}
          UPDATED_DEPENDENCIES_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -euo pipefail

          echo "eligible=false" >> "$GITHUB_OUTPUT"

          if [ "$IS_DEPENDABOT" != "true" ]; then
            echo "Manual review required: auto-merge applies only to verified Dependabot updates."
            exit 0
          fi
          if [ "$METADATA_OUTCOME" != "success" ]; then
            echo "Classification failed: verified Dependabot metadata is unavailable."
            exit 1
          fi
          if [ -z "$PACKAGE_ECOSYSTEM" ] || [ -z "$DIRECTORY" ] || [ -z "$TARGET_BRANCH" ]; then
            echo "Classification failed: aggregate Dependabot metadata is incomplete."
            exit 1
          fi

          if ! jq -e '
            type == "array" and length > 0 and all(.[ ];
              (.dependencyName | type == "string" and length > 0) and
              (.updateType == "version-update:semver-patch" or
               .updateType == "version-update:semver-minor" or
               .updateType == "version-update:semver-major") and
              (.packageEcosystem | type == "string" and length > 0) and
              (.directory | type == "string" and length > 0) and
              (.targetBranch | type == "string" and length > 0)
            )' <<< "$UPDATED_DEPENDENCIES_JSON" >/dev/null; then
            echo "Classification failed: Dependabot metadata is missing or malformed."
            exit 1
          fi

          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor|version-update:semver-major) ;;
            *)
              echo "Classification failed: the aggregate update type is unavailable."
              exit 1
              ;;
          esac

          case "$PACKAGE_ECOSYSTEM:$DIRECTORY" in
            cargo:/|cargo:/fuzz|github_actions:/) ;;
            *)
              echo "Manual review required: the package ecosystem or directory is not eligible."
              exit 0
              ;;
          esac

          if [ "$TARGET_BRANCH" != "main" ]; then
            echo "Manual review required: the metadata target branch is not main."
            exit 0
          fi

          if ! jq -e \
            --arg ecosystem "$PACKAGE_ECOSYSTEM" \
            --arg directory "$DIRECTORY" \
            --arg target "$TARGET_BRANCH" \
            'all(.[ ];
              .packageEcosystem == $ecosystem and
              .directory == $directory and
              .targetBranch == $target
            )' <<< "$UPDATED_DEPENDENCIES_JSON" >/dev/null; then
            echo "Manual review required: grouped dependency metadata is mixed."
            exit 0
          fi

          highest_update_type="$(jq -er '
            if any(.[ ]; .updateType == "version-update:semver-major") then
              "version-update:semver-major"
            elif any(.[ ]; .updateType == "version-update:semver-minor") then
              "version-update:semver-minor"
            else
              "version-update:semver-patch"
            end
          ' <<< "$UPDATED_DEPENDENCIES_JSON")"

          if [ "$highest_update_type" != "$UPDATE_TYPE" ]; then
            echo "Manual review required: aggregate and dependency update types disagree."
            exit 0
          fi
          if [ "$highest_update_type" = "version-update:semver-major" ]; then
            echo "Manual review required: major updates are not eligible."
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "Verified Dependabot metadata satisfies the auto-merge policy."

  eligibility:
    name: Auto-merge eligible
    needs: review-gate
    if: needs.review-gate.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Record eligibility
        run: echo "Auto-merge eligibility is verified."
