name: Dependabot review gate

# Reports how the dependency automation classifies a Dependabot pull request.
# The classification policy is scripts/dependabot-automerge.sh, read from the
# default branch so the pull request cannot change it. The job reads GitHub API
# metadata only; it does not execute pull request code, post comments, approve
# reviews, or merge changes.
#
# The job succeeds for updates that need manual review, so a reviewed major
# update can merge. Merging eligible updates is the separate, privileged
# dependabot-reconcile.yml workflow, which repeats the classification itself.

"on":
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions: {}

concurrency:
  group: dependabot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-gate:
    name: Classify dependency update
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read  # Reads pull request, commit, and changed-file metadata.
    steps:
      - name: Check out the default-branch policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts

      - name: Classify pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          result=$(scripts/dependabot-automerge.sh classify "$PR_NUMBER")
          jq -r '"Decision: \(.decision). Reason: \(.reason)."' <<< "$result" \
            | tee -a "$GITHUB_STEP_SUMMARY"
