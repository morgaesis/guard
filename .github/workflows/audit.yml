name: Security & Dependency Audit

on:
  branch_protection_rule:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret_scan:
    name: Secret Leak Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          install_root="$RUNNER_TEMP/gitleaks"
          mkdir -p "$install_root"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_root" gitleaks
          test "$("$install_root/gitleaks" version)" = "$GITLEAKS_VERSION"

      - name: Fetch published main history
        shell: bash
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Select complete commit range
        id: leak-range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TESTED_SHA: ${{ github.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          require_sha() {
            [[ "$1" =~ ^[0-9a-f]{40}$ ]] || {
              echo "event supplied an invalid commit id" >&2
              exit 1
            }
          }
          case "$EVENT_NAME" in
            pull_request)
              require_sha "$PR_BASE_SHA"
              require_sha "$PR_HEAD_SHA"
              require_sha "$TESTED_SHA"
              git merge-base --is-ancestor "$PR_BASE_SHA" "$TESTED_SHA" || {
                echo "tested pull-request commit does not contain its base" >&2
                exit 1
              }
              git merge-base --is-ancestor "$PR_HEAD_SHA" "$TESTED_SHA" || {
                echo "tested pull-request commit does not contain its head" >&2
                exit 1
              }
              log_opts="--full-history --diff-merges=first-parent --diff-filter=tuxdb $PR_BASE_SHA..$TESTED_SHA"
              ;;
            push)
              require_sha "$PUSH_AFTER_SHA"
              if [[ "$PUSH_BEFORE_SHA" =~ ^0{40}$ ]]; then
                log_opts="--full-history --diff-merges=first-parent --diff-filter=tuxdb $PUSH_AFTER_SHA"
              else
                require_sha "$PUSH_BEFORE_SHA"
                log_opts="--full-history --diff-merges=first-parent --diff-filter=tuxdb $PUSH_BEFORE_SHA..$PUSH_AFTER_SHA"
              fi
              ;;
            *)
              log_opts='--full-history --diff-merges=first-parent --diff-filter=tuxdb origin/main'
              ;;
          esac
          printf 'log_opts=%s\n' "$log_opts" >> "$GITHUB_OUTPUT"

      - name: Validate exact historical fingerprints
        shell: bash
        run: |
          set -euo pipefail
          normalized_config=$(sed -E '/^[[:space:]]*(#|$)/d; s/[[:space:]]//g' .gitleaks.toml)
          test "$normalized_config" = $'[extend]\nuseDefault=true' || {
            echo "gitleaks configuration must extend only the default rules" >&2
            exit 1
          }
          empty_ignore="$RUNNER_TEMP/empty-gitleaksignore"
          findings="$RUNNER_TEMP/gitleaks-unignored.json"
          : > "$empty_ignore"
          set +e
          "$RUNNER_TEMP/gitleaks/gitleaks" git --config .gitleaks.toml \
            --gitleaks-ignore-path "$empty_ignore" --redact --no-banner \
            --exit-code 1 --report-format json --report-path "$findings" \
            --log-opts='--full-history --diff-merges=first-parent --diff-filter=tuxdb origin/main' . \
            > "$RUNNER_TEMP/gitleaks-unignored.log" 2>&1
          scan_status=$?
          set -e
          case "$scan_status" in
            0|1) ;;
            *)
              sed -n '1,40p' "$RUNNER_TEMP/gitleaks-unignored.log" >&2
              exit "$scan_status"
              ;;
          esac
          test -f "$findings" || printf '[]\n' > "$findings"
          declare -A seen=()
          while IFS= read -r fingerprint || [ -n "$fingerprint" ]; do
            [[ -z "$fingerprint" || "$fingerprint" == \#* ]] && continue
            if [[ ! "$fingerprint" =~ ^([0-9a-f]{40}):([A-Za-z0-9._/-]+):([A-Za-z0-9._-]+):([1-9][0-9]*)$ ]]; then
              echo "invalid or non-commit-scoped gitleaks fingerprint" >&2
              exit 1
            fi
            commit=${BASH_REMATCH[1]}
            path=${BASH_REMATCH[2]}
            if [[ "$path" == /* || "$path" == *//* || "$path" == ../* || "$path" == */../* ]]; then
              echo "gitleaks fingerprint contains a non-repository path" >&2
              exit 1
            fi
            if [[ -n "${seen[$fingerprint]+present}" ]]; then
              echo "duplicate gitleaks fingerprint" >&2
              exit 1
            fi
            seen["$fingerprint"]=1
            git cat-file -e "${commit}^{commit}"
            git cat-file -e "${commit}:${path}"
            git merge-base --is-ancestor "$commit" origin/main || {
              echo "gitleaks fingerprint is not part of published main history" >&2
              exit 1
            }
            jq -e --arg fingerprint "$fingerprint" \
              'any(.[]; .Fingerprint == $fingerprint)' "$findings" >/dev/null || {
              echo "gitleaks fingerprint does not identify a finding from the pinned scanner" >&2
              exit 1
            }
          done < .gitleaksignore

      - name: Prove merge-parent coverage
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/gitleaks-merge-fixture"
          gitleaks_bin="$RUNNER_TEMP/gitleaks/gitleaks"
          mkdir -p "$fixture"
          git -C "$fixture" init --quiet --initial-branch=main
          if ! git -C "$fixture" config user.name >/dev/null; then
            git -C "$fixture" config user.name 'Guard CI'
          fi
          if ! git -C "$fixture" config user.email >/dev/null; then
            git -C "$fixture" config user.email 'guard-ci@example.invalid'
          fi
          printf 'setting = base\n' > "$fixture/generated-fixture.txt"
          git -C "$fixture" add generated-fixture.txt
          git -C "$fixture" commit --quiet -m 'base'
          base_sha=$(git -C "$fixture" rev-parse HEAD)
          git -C "$fixture" switch --quiet -c secondary
          printf 'setting = secondary\n' > "$fixture/generated-fixture.txt"
          git -C "$fixture" add generated-fixture.txt
          git -C "$fixture" commit --quiet -m 'secondary fixture'
          secondary_sha=$(git -C "$fixture" rev-parse HEAD)
          git -C "$fixture" switch --quiet main
          printf 'setting = main\n' > "$fixture/generated-fixture.txt"
          git -C "$fixture" add generated-fixture.txt
          git -C "$fixture" commit --quiet -m 'main fixture'
          fixture_value=$(printf 'guard-merge-parent-regression' | sha256sum | cut -d ' ' -f 1)
          set +e
          git -C "$fixture" merge --quiet --no-ff --no-commit secondary
          merge_status=$?
          set -e
          test "$merge_status" -eq 1 || {
            echo "merge-result fixture did not produce the expected conflict" >&2
            exit 1
          }
          printf 'api_key = %s\n' "$fixture_value" > "$fixture/generated-fixture.txt"
          git -C "$fixture" add generated-fixture.txt
          git -C "$fixture" commit --quiet -m 'merge fixture'
          merge_sha=$(git -C "$fixture" rev-parse HEAD)
          git -C "$fixture" merge-base --is-ancestor "$secondary_sha" "$merge_sha"
          set +e
          "$gitleaks_bin" git --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --redact --no-banner --exit-code 1 \
            --log-opts="--full-history --diff-merges=first-parent --diff-filter=tuxdb $base_sha..$merge_sha" \
            "$fixture" > "$RUNNER_TEMP/gitleaks-merge-fixture.log" 2>&1
          scan_status=$?
          set -e
          test "$scan_status" -eq 1 || {
            echo "leak scan did not detect the generated merge-result fixture" >&2
            exit 1
          }

      - name: Scan selected repository history
        shell: bash
        env:
          GITLEAKS_LOG_OPTS: ${{ steps.leak-range.outputs.log_opts }}
        run: |
          set -euo pipefail
          # The ignore file contains only immutable finding fingerprints from
          # published history. New values, rules, files, and lines remain in scope.
          scan=("$RUNNER_TEMP/gitleaks/gitleaks" git --config .gitleaks.toml \
            --redact --no-banner --exit-code 1)
          if [ -n "$GITLEAKS_LOG_OPTS" ]; then
            scan+=(--log-opts="$GITLEAKS_LOG_OPTS")
          fi
          "${scan[@]}" .

  cargo_audit:
    name: Security Audit (CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          cache: false
          rustflags: ""

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Run audit
        run: cargo audit

  cargo_deny:
    name: License & Dependency Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          cache: false
          rustflags: ""

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Run cargo-deny
        run: cargo deny check advisories bans licenses sources

  cargo_outdated:
    name: Report Outdated Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          cache: false
          rustflags: ""

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Install cargo-outdated
        run: cargo install cargo-outdated --version 0.19.0 --locked

      - name: Report outdated dependencies
        run: |
          set +e
          cargo outdated --exit-code 3
          status=$?
          set -e
          case "$status" in
            0) ;;
            3) echo "::warning::Available dependency updates are listed above." ;;
            *) exit "$status" ;;
          esac

  cargo_machete:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          cache: false
          rustflags: ""

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Install cargo-machete
        run: cargo install cargo-machete --version 0.9.2 --locked

      - name: Check unused
        run: cargo machete

  # Fails when the required_status_checks rule drifts from the declaration
  # committed on main. Pull requests validate their proposed declaration
  # separately so a context change does not redefine the live comparison.
  branch_protection_drift:
    name: Branch Protection Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate proposed required checks
        run: scripts/sync-branch-protection.sh --validate

      - name: Compare live required checks with main declaration
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          checker=scripts/sync-branch-protection.sh
          if [ "$EVENT_NAME" = pull_request ]; then
            git fetch --no-tags origin main:refs/remotes/origin/main
            checker="$RUNNER_TEMP/sync-branch-protection-main.sh"
            git show origin/main:scripts/sync-branch-protection.sh > "$checker"
          fi
          set +e
          bash "$checker" --check
          status=$?
          set -e
          case "$status" in
            0) exit 0 ;;
            1)
              echo "::error::Required status checks on main drifted from the declaration committed on main."
              exit 1
              ;;
            *)
              echo "::error::Branch rules are unreadable or no required_status_checks rule exists on main."
              exit 1
              ;;
          esac

  dependency_review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0

  dependency_review_not_applicable:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - run: echo "Dependency review applies to pull requests."

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Uploads CodeQL SARIF to code scanning.
    strategy:
      fail-fast: false
      matrix:
        language: [actions, rust]
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a  # v4.37.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a  # v4.37.1

  zizmor:
    name: GitHub Actions Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Uploads zizmor SARIF to code scanning.
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Analyze workflows with zizmor
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02  # v0.6.0
        with:
          version: 1.27.0

  ossf_scorecard:
    name: OSSF Scorecard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Publishes the signed Scorecard result.
      security-events: write  # Uploads Scorecard SARIF to code scanning.
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a  # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload Scorecard results to code scanning
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a  # v4.37.1
        with:
          sarif_file: results.sarif
