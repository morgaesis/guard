---
name: Release

"on":
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    uses: ./.github/workflows/release.yml
    permissions:
      actions: read
      checks: read
      contents: read

  release:
    name: Create GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Publishes release assets and release notes.
      id-token: write  # Requests the OIDC token that signs the provenance.
      attestations: write  # Stores the provenance attestation.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts

      - name: Generate checksums
        shell: bash
        run: |
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.cdx.json' \) -print \
            | LC_ALL=C sort | while IFS= read -r asset; do
            checksum=$(sha256sum "$asset" | cut -d ' ' -f 1)
            printf '%s  %s\n' "$checksum" "$(basename "$asset")"
          done > SHA256SUMS
          test -s SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: |
            artifacts/**/*.tar.gz
            artifacts/**/*.cdx.json
            SHA256SUMS

      - name: Create Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/publish-release.sh --artifacts-dir artifacts --checksums SHA256SUMS
