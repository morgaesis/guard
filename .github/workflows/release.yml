---
name: Release Validation

"on":
  workflow_call:

permissions:
  actions: read  # Inspect mainline workflow runs before accepting a release tag.
  checks: read  # Validate required check results for the release commit.
  contents: read  # Inspect signed refs and the release commit.

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RELEASE_LABEL: ${{ github.event_name == 'pull_request' && 'ci' || github.ref_name }}
  RUSTUP_TOOLCHAIN: 1.95.0

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          cache: false
          rustflags: ""
          toolchain: 1.95.0
      - name: Verify signed tag and mandatory release evidence
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "guard") | .version')
          test "$RELEASE_TAG" = "v${version}" || {
            echo "release tag does not match Cargo package version v${version}"
            exit 1
          }
          tag_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")
          test "$(jq -r '.object.type' <<< "$tag_ref")" = tag || {
            echo "release ref is not an annotated tag"
            exit 1
          }
          tag_sha=$(jq -r '.object.sha' <<< "$tag_ref")
          tag_object=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}")
          test "$(jq -r '.verification.verified' <<< "$tag_object")" = true || {
            echo "release tag signature is not verified"
            exit 1
          }
          test "$(jq -r '.object.type' <<< "$tag_object")" = commit || {
            echo "release tag does not resolve directly to a commit"
            exit 1
          }
          tag_commit=$(jq -r '.object.sha' <<< "$tag_object")
          [[ "$tag_commit" =~ ^[0-9a-f]{40}$ ]] || {
            echo "release tag resolved to an invalid commit"
            exit 1
          }
          test "$(git rev-parse "${RELEASE_TAG}^{}")" = "$tag_commit" || {
            echo "checked out tag does not match the GitHub tag object"
            exit 1
          }
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$tag_commit" origin/main || {
            echo "release tag commit is not reachable from origin/main"
            exit 1
          }
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag_commit}" --jq '.commit.verification.verified')" = true || {
            echo "release commit signature is not verified"
            exit 1
          }
          wait_for_mainline_workflow() {
            local workflow="$1" label="$2" run_id
            # Positional parameters in the single-quoted script belong to the nested shell.
            # shellcheck disable=SC2016
            if ! run_id=$(timeout 120s bash -c '
              while :; do
                run_id=$(gh run list --workflow "$1" --commit "$2" --event push --limit 10 \
                  --json databaseId,headSha \
                  --jq "map(select(.headSha == \"${2}\")) | first | .databaseId // empty")
                if [ -n "$run_id" ]; then
                  printf "%s\n" "$run_id"
                  exit 0
                fi
                sleep 3
              done
            ' _ "$workflow" "$tag_commit"); then
              echo "$label run was not registered within the discovery window"
              return 1
            fi
            test -n "$run_id" || {
              echo "$label run was not found for the release commit"
              return 1
            }
            timeout 1800s gh run watch "$run_id" --compact --exit-status || {
              echo "$label did not pass for the release commit"
              return 1
            }
          }
          wait_for_mainline_workflow ci.yml "mainline CI"
          wait_for_mainline_workflow audit.yml "security audit"
          wait_for_mainline_workflow dependabot-automerge.yml "dependency classification"
          scripts/sync-branch-protection.sh --check
          scripts/sync-branch-protection.sh --verify-commit "$tag_commit"
      - name: Run tests
        run: cargo test --locked

  release_targets:
    name: Resolve release targets
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Read canonical target matrix
        id: targets
        shell: bash
        run: printf 'matrix=%s\n' "$(bash scripts/build-release-archive.sh --matrix-json)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: [test, release_targets]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release_targets.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          target: ${{ matrix.target }}
          cache: false
          rustflags: ""
          toolchain: 1.95.0

      - name: Set reproducible build epoch
        shell: bash
        run: |
          source_date_epoch=$(git show -s --format=%ct HEAD)
          [[ "$source_date_epoch" =~ ^[1-9][0-9]*$ ]] || {
            echo "source commit has an invalid timestamp" >&2
            exit 1
          }
          printf 'SOURCE_DATE_EPOCH=%s\n' "$source_date_epoch" >> "$GITHUB_ENV"
          rustc_version=$(rustc --version)
          [[ "$rustc_version" == "rustc 1.95.0 "* ]] || {
            echo "release build selected an unexpected Rust compiler: $rustc_version" >&2
            exit 1
          }

      - name: Install Cross
        if: matrix.use_cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build reproducible platform deployment archive
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          USE_CROSS: ${{ matrix.use_cross || false }}
        run: bash scripts/build-release-archive.sh

      - name: Verify cross-built Linux architecture
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        env:
          BINARY: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
        run: |
          file "$BINARY"
          file "$BINARY" | grep -q aarch64

      - name: Smoke test deployment archive
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: |
          bundle="guard-${RELEASE_LABEL}-${BUILD_TARGET}"
          archive="dist/${bundle}.tar.gz"
          smoke="dist/smoke"
          mkdir -p "$smoke"
          tar -C "$smoke" -xzf "$archive"
          root="$smoke/$bundle"
          test -f "$root/INSTALL.md"
          test -f "$root/DEPLOYMENT.md"
          test -f "$root/DEVELOPMENT.md"
          test -f "$root/SECURITY.md"
          test -f "$root/ARCHITECTURE.md"
          test -f "$root/ROADMAP.md"
          test -f "$root/LICENSE"
          test -f "$root/.env.example"
          test -f "$root/docs/release-verification.md"
          test -f "$root/docs/configuration.md"
          test -f "$root/docs/api-proxy.md"
          test -f "$root/ctf/DESIGN.md"
          test -f "$root/examples/verbs.yaml"
          test -f "$root/examples/verbs-readonly.yaml"
          test -f "$root/examples/verbs-kubectl.yaml"
          test -f "$root/examples/api-policy.yaml"
          test -f "$root/examples/fallback-models.env"
          test -f "$root/examples/system-prompt-append-tools.md"
          test -f "$root/deployment/windows/install-guard.ps1"
          actual_manifest="dist/${bundle}.manifest.actual"
          find "$root" -type f -printf '%P\n' | LC_ALL=C sort > "$actual_manifest"
          diff -u "$root/ARCHIVE-MANIFEST" "$actual_manifest"
          rm "$actual_manifest"
          (cd "$root" && sha256sum --check BINARY-SHA256)
          python3 - "$root" <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          missing = []
          for document in root.rglob("*.md"):
              text = document.read_text(encoding="utf-8")
              for link in re.findall(r"\[[^\]]*\]\(([^)]+)\)", text):
                  target = link.split("#", 1)[0]
                  if not target or "://" in target or target.startswith("mailto:"):
                      continue
                  if not (document.parent / target).resolve().exists():
                      missing.append(f"{document.relative_to(root)} -> {target}")
          if missing:
              raise SystemExit("missing relative Markdown targets:\n" + "\n".join(missing))
          PY
          case "$BUILD_TARGET" in
            aarch64-unknown-linux-gnu)
              file "$root/${ARTIFACT_NAME}" | grep -q aarch64
              ;;
            *)
              "$root/${ARTIFACT_NAME}" --version
              ;;
          esac
          case "$BUILD_TARGET" in
            *-linux-gnu)
              (cd "$root" && sha256sum --check --strict INSTALL-SHA256)
              test -x "$root/deployment/systemd/guard-operator"
              test -x "$root/deployment/systemd/test-guard-service-expansion.sh"
              test -x "$root/deployment/systemd/upgrade-guard"
              test -x "$root/deployment/systemd/test-upgrade-guard.sh"
              test -f "$root/deployment/systemd/guard.service"
              test -f "$root/deployment/systemd/guard-exec-as-caller.service"
              test -f "$root/deployment/systemd/guard.env.example"
              test -f "$root/deployment/hardening/guard.apparmor.example"
              test -f "$root/deployment/hardening/seccomp-deny-escape.json"
              ;;
            x86_64-pc-windows-msvc)
              test -f "$root/deployment/windows/install-guard.ps1"
              test -f "$root/deployment/windows/install-guard.Tests.ps1"
              ;;
          esac

      - name: Exercise packaged systemd argument expansion
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          RELEASE_SMOKE_TARGET: ${{ matrix.target }}
        run: |
          case "$RELEASE_SMOKE_TARGET" in
            x86_64-unknown-linux-gnu) ;;
            *)
              echo "unexpected Unix smoke target" >&2
              exit 1
              ;;
          esac
          sudo "dist/smoke/guard-${RELEASE_LABEL}-${RELEASE_SMOKE_TARGET}/deployment/systemd/test-guard-service-expansion.sh"

      - name: Fault-inject packaged Unix upgrade and rollback
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          RELEASE_SMOKE_TARGET: ${{ matrix.target }}
        run: |
          case "$RELEASE_SMOKE_TARGET" in
            x86_64-unknown-linux-gnu) ;;
            *)
              echo "unexpected Unix smoke target" >&2
              exit 1
              ;;
          esac
          "dist/smoke/guard-${RELEASE_LABEL}-${RELEASE_SMOKE_TARGET}/deployment/systemd/test-upgrade-guard.sh"

      - name: Test packaged Windows installer contract
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUNDLE_ROOT: dist/smoke/guard-${{ env.RELEASE_LABEL }}-${{ matrix.target }}
        run: |
          Import-Module Pester -MinimumVersion 5.0.0 -ErrorAction Stop
          Invoke-Pester -Path "$env:BUNDLE_ROOT/deployment/windows/install-guard.Tests.ps1" -CI

      - name: Fault-inject packaged Windows install and rollback
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUNDLE_ROOT: dist/smoke/guard-${{ env.RELEASE_LABEL }}-${{ matrix.target }}
        run: |
          $installer = Resolve-Path "$env:BUNDLE_ROOT/deployment/windows/install-guard.ps1"
          $candidate = Resolve-Path "$env:BUNDLE_ROOT/guard.exe"
          $candidateHash = ((Get-Content -LiteralPath "$env:BUNDLE_ROOT/BINARY-SHA256" -Raw).Trim() -split '\s+')[0]
          if ($candidateHash -notmatch '^[0-9a-f]{64}$') { throw 'Packaged binary manifest is invalid.' }
          $faultCandidate = Join-Path $env:RUNNER_TEMP 'guard-fault-candidate.exe'
          $faultEnvironment = Join-Path $env:RUNNER_TEMP 'guard-fault-environment.txt'
          Copy-Item -LiteralPath $candidate -Destination $faultCandidate
          $stream = [IO.File]::Open($faultCandidate, [IO.FileMode]::Append, [IO.FileAccess]::Write, [IO.FileShare]::None)
          try { $stream.WriteByte(0) } finally { $stream.Dispose() }
          $faultCandidateHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $faultCandidate).Hash
          Set-Content -LiteralPath $faultEnvironment -Value 'GUARD_LLM_MODEL=fixture/fault-injection' -NoNewline
          $candidateInstall = @{ Action = 'install'; CandidateExe = [string]$candidate; ExpectedSha256 = $candidateHash }
          $faultInstall = @{ Action = 'install'; CandidateExe = $faultCandidate; ExpectedSha256 = $faultCandidateHash; EnvFile = $faultEnvironment }

          $env:GUARD_INSTALLER_TEST_MODE = '1'
          . $installer -Action status
          Remove-Item Env:GUARD_INSTALLER_TEST_MODE

          function Get-DatabaseHashes([Parameter(Mandatory)]$StatePaths) {
            $hashes = @{}
            foreach ($path in Get-DatabasePaths -Database $StatePaths.StateDb) {
              if (Test-Path -LiteralPath $path -PathType Leaf) {
                $hashes[[IO.Path]::GetFileName($path)] = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash
              }
            }
            return $hashes
          }
          function Assert-HashMapsEqual([hashtable]$Expected, [hashtable]$Actual, [string]$Label) {
            if ($Expected.Count -ne $Actual.Count) { throw "$Label file count changed." }
            foreach ($name in $Expected.Keys) {
              if (-not $Actual.ContainsKey($name) -or $Actual[$name] -ne $Expected[$name]) {
                throw "$Label content changed for $name."
              }
            }
          }
          function Get-ServiceEnvironmentLines {
            return @((Get-ItemProperty -LiteralPath (Get-ServiceRegistryPath) -Name Environment).Environment | Sort-Object)
          }
          function Get-ServicePathName {
            return [string](Get-CimInstance Win32_Service -Filter "Name='$ServiceName'").PathName
          }
          function Get-ApiRevertHashes([Parameter(Mandatory)]$StatePaths, [string]$GuardSid) {
            $root = Get-ApiRevertRoot -StatePaths $StatePaths
            $hashes = @{}
            if (-not (Test-Path -LiteralPath $root)) { return $hashes }
            Reset-TreeForAdministrativeMaintenance -Path $root
            try {
              foreach ($item in Get-PrunedTreeItems -Path $root) {
                if (-not $item.PSIsContainer) {
                  $hashes[$item.FullName.Substring($root.Length).TrimStart('\')] = (Get-FileHash -Algorithm SHA256 -LiteralPath $item.FullName).Hash
                }
              }
              return $hashes
            }
            finally {
              Protect-PrivateServiceTree -Path $root -GuardSid $GuardSid
            }
          }

          try {
            & $installer @candidateInstall
            & $installer -Action access-list -Json | Out-Null
            $guardSid = Get-GuardSid
            $statePaths = Get-GuardStatePaths -ServicePathName (Get-ServicePathName)
            Assert-DeploymentAcls -GuardSid $guardSid -StatePaths $statePaths
            Set-ServiceRegistryAcl -GuardSid $guardSid

            $stockPathName = Get-ServicePathName
            $customPathName = "$stockPathName `"--audit-log`" `"$DataDir\audit.log`""
            & sc.exe config $ServiceName binPath= $customPathName | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not install the custom service command fixture.' }

            $taskCount = @(Get-ScheduledTask -TaskName 'guard-op-*' -ErrorAction SilentlyContinue).Count
            $operatorOutput = @(& pwsh -NoLogo -NoProfile -NonInteractive -File $installer -Action access-show -Reference 'gr-00000000000000000000000000000000' -Json 2>&1)
            $operatorStatus = $LASTEXITCODE
            if ($operatorStatus -ne 125) { throw "Unknown access reference returned native status $operatorStatus instead of 125." }
            try { $operatorDocument = ($operatorOutput -join "`n") | ConvertFrom-Json -ErrorAction Stop }
            catch { throw 'Unknown access reference did not return structured JSON.' }
            if ($operatorDocument.type -ne 'access_error' -or $operatorDocument.error -notmatch 'unknown or unauthorized access reference') {
              throw 'Unknown access reference returned the wrong structured error.'
            }

            $decisionOutput = @(& pwsh -NoLogo -NoProfile -NonInteractive -File $installer -Action access-approve -Reference 'gr-00000000000000000000000000000000' -Json 2>&1)
            $decisionStatus = $LASTEXITCODE
            if ($decisionStatus -ne 1) { throw "Unknown access approval returned native status $decisionStatus instead of 1." }
            try { $decisionDocument = ($decisionOutput -join "`n") | ConvertFrom-Json -ErrorAction Stop }
            catch { throw 'Unknown access approval did not return structured JSON.' }
            if ($decisionDocument.type -ne 'access_decisions' -or $decisionDocument.response.result -ne 'access_decisions' -or $decisionDocument.response.items[0].message -ne 'unknown access request') {
              throw 'Token-required access approval did not reach the operator handler.'
            }
            if (@(Get-ScheduledTask -TaskName 'guard-op-*' -ErrorAction SilentlyContinue).Count -ne $taskCount) {
              throw 'Operator failure left a scheduled task behind.'
            }
            if (@(Get-ChildItem -LiteralPath $TaskOutDir -Filter 'guard-op-*.out' -Force -ErrorAction SilentlyContinue).Count -ne 0) {
              throw 'Operator failure left task output behind.'
            }
            if (@(Get-ChildItem -LiteralPath $TaskOutDir -Filter 'guard-op-*.status' -Force -ErrorAction SilentlyContinue).Count -ne 0) {
              throw 'Operator failure left task status behind.'
            }

            $serviceKey = Get-ServiceRegistryPath
            $current = @((Get-ItemProperty -LiteralPath $serviceKey -Name Environment).Environment)
            New-ItemProperty -LiteralPath $serviceKey -Name Environment -PropertyType MultiString -Value ($current + 'GUARD_INSTALLER_CI_MARKER=retained') -Force | Out-Null
            & $installer @candidateInstall | Out-Null
            if ((Get-ServicePathName) -ne $customPathName) {
              throw 'Installer rerun did not preserve the exact service command line.'
            }
            $names = @((Get-ItemProperty -LiteralPath $serviceKey -Name Environment).Environment | ForEach-Object { $_.Split('=', 2)[0] })
            if ($names -notcontains 'GUARD_INSTALLER_CI_MARKER') {
              throw 'Installer rerun did not preserve an unrelated service environment entry.'
            }

            Wait-ServiceStopped -Name $ServiceName
            $baselineDatabase = Get-DatabaseHashes -StatePaths $statePaths
            $baselineEnvironment = Get-ServiceEnvironmentLines
            $baselineBinary = (Get-FileHash -Algorithm SHA256 -LiteralPath $DeployedExe).Hash
            $baselineCatalog = (Get-FileHash -Algorithm SHA256 -LiteralPath $VerbsPath).Hash
            $baselinePathName = Get-ServicePathName
            $apiRoot = Get-ApiRevertRoot -StatePaths $statePaths
            if (Test-Path -LiteralPath $apiRoot) {
              Reset-TreeForAdministrativeMaintenance -Path $apiRoot
              Remove-Item -LiteralPath $apiRoot -Recurse -Force
            }
            New-Item -ItemType Directory -Path $apiRoot -Force | Out-Null
            $apiBody = Join-Path $apiRoot 'api-revert-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.body'
            Protect-PrivateServiceTree -Path $apiRoot -GuardSid $guardSid
            # API-revert bodies are authority only while referenced by durable
            # provisional state, so startup prunes an owned orphan. Keep this
            # end-to-end rollback baseline empty; the Pester contract covers a
            # nonempty snapshot round trip through the backup helpers.
            $baselineApiReverts = Get-ApiRevertHashes -StatePaths $statePaths -GuardSid $guardSid
            Start-GuardService -Name $ServiceName

            $env:GUARD_INSTALLER_TEST_FAULT = 'after-environment'
            $faultObserved = $false
            try {
              & $installer @faultInstall | Out-Null
            }
            catch {
              $faultObserved = $_.Exception.Message -match 'Injected installer fault at after-environment'
              if (-not $faultObserved) { throw }
            }
            finally {
              Remove-Item Env:GUARD_INSTALLER_TEST_FAULT -ErrorAction SilentlyContinue
            }
            if (-not $faultObserved) { throw 'Installer fault injection did not fail the upgrade.' }
            Wait-ServiceStopped -Name $ServiceName
            Assert-HashMapsEqual -Expected $baselineDatabase -Actual (Get-DatabaseHashes -StatePaths $statePaths) -Label 'Automatic rollback database'
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $DeployedExe).Hash -ne $baselineBinary) {
              throw 'Automatic rollback did not restore the binary.'
            }
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $VerbsPath).Hash -ne $baselineCatalog) {
              throw 'Automatic rollback did not restore the catalog.'
            }
            if (Compare-Object $baselineEnvironment (Get-ServiceEnvironmentLines)) {
              throw 'Automatic rollback did not restore the service environment.'
            }
            if ((Get-ServicePathName) -ne $baselinePathName) {
              throw 'Automatic rollback did not restore the exact service command line.'
            }
            Start-GuardService -Name $ServiceName

            $upgradeOutput = @(& $installer @faultInstall 6>&1 | ForEach-Object { [string]$_ })
            $backupLine = $upgradeOutput | Where-Object { $_ -match '^Rollback backup: (.+)$' } | Select-Object -Last 1
            if (-not $backupLine) { throw 'Successful upgrade did not report a rollback backup.' }
            [void]($backupLine -match '^Rollback backup: (.+)$')
            $backupName = $Matches[1]
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $DeployedExe).Hash -eq $baselineBinary) {
              throw 'Successful test upgrade did not replace the binary.'
            }
            if ((Get-ServicePathName) -ne $baselinePathName) {
              throw 'Successful upgrade discarded the exact service command line.'
            }

            Wait-ServiceStopped -Name $ServiceName
            Reset-TreeForAdministrativeMaintenance -Path $apiRoot
            [IO.File]::WriteAllBytes($apiBody, [byte[]](9, 9, 9))
            Protect-PrivateServiceTree -Path $apiRoot -GuardSid $guardSid
            [IO.File]::WriteAllBytes($StateDb, [Text.Encoding]::UTF8.GetBytes('invalid upgraded database fixture'))
            [IO.File]::WriteAllBytes("$StateDb-journal", [Text.Encoding]::UTF8.GetBytes('invalid rollback journal fixture'))
            & $installer -Action rollback -Backup $backupName | Out-Null
            Wait-ServiceStopped -Name $ServiceName
            Assert-HashMapsEqual -Expected $baselineDatabase -Actual (Get-DatabaseHashes -StatePaths $statePaths) -Label 'Post-success rollback database'
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $DeployedExe).Hash -ne $baselineBinary) {
              throw 'Post-success rollback did not restore the binary.'
            }
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $VerbsPath).Hash -ne $baselineCatalog) {
              throw 'Post-success rollback did not restore the catalog.'
            }
            if (Compare-Object $baselineEnvironment (Get-ServiceEnvironmentLines)) {
              throw 'Post-success rollback did not restore the service environment.'
            }
            if ((Get-ServicePathName) -ne $baselinePathName) {
              throw 'Post-success rollback did not restore the exact service command line.'
            }
            Assert-HashMapsEqual -Expected $baselineApiReverts -Actual (Get-ApiRevertHashes -StatePaths $statePaths -GuardSid $guardSid) -Label 'Post-success rollback API revert snapshot'
            Start-GuardService -Name $ServiceName
            Verify-GuardService -ExpectedHash $baselineBinary -ExpectedVersion (Get-GuardVersion -GuardExe $DeployedExe) -ExpectedStateDb $statePaths.StateDb -ExpectedSocket $statePaths.SocketName
            Assert-DeploymentAcls -GuardSid $guardSid -StatePaths $statePaths
            Set-ServiceRegistryAcl -GuardSid $guardSid

            Wait-ServiceStopped -Name $ServiceName
            Set-GuardServiceConfiguration -PathName $baselinePathName -StartMode 'Disabled'
            $disabledUpgradeOutput = @(& $installer @candidateInstall 6>&1 | ForEach-Object { [string]$_ })
            $disabledBackupLine = $disabledUpgradeOutput | Where-Object { $_ -match '^Rollback backup: (.+)$' } | Select-Object -Last 1
            if (-not $disabledBackupLine) { throw 'Disabled service upgrade did not report a rollback backup.' }
            [void]($disabledBackupLine -match '^Rollback backup: (.+)$')
            $disabledBackupName = $Matches[1]
            $disabledConfig = Get-CimInstance Win32_Service -Filter "Name='$ServiceName'"
            if ($disabledConfig.StartMode -ne 'Disabled' -or (Get-Service -Name $ServiceName).Status -ne 'Stopped') {
              throw 'Upgrade did not restore disabled stopped service state.'
            }
            & $installer -Action rollback -Backup $disabledBackupName | Out-Null
            $disabledConfig = Get-CimInstance Win32_Service -Filter "Name='$ServiceName'"
            if ($disabledConfig.StartMode -ne 'Disabled' -or (Get-Service -Name $ServiceName).Status -ne 'Stopped') {
              throw 'Rollback did not verify and restore disabled stopped service state.'
            }
          }
          finally {
            Remove-Item Env:GUARD_INSTALLER_TEST_FAULT -ErrorAction SilentlyContinue
            & $installer -Action uninstall -Purge
            Remove-Item -LiteralPath $faultCandidate, $faultEnvironment -Force -ErrorAction SilentlyContinue
          }

      - name: Verify independent release build
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          USE_CROSS: ${{ matrix.use_cross || false }}
        run: |
          replica_source="$RUNNER_TEMP/repro-source"
          replica_dist="$RUNNER_TEMP/repro-dist"
          mkdir -p "$replica_dist"
          git worktree add --detach "$replica_source" "$GITHUB_SHA"
          (
            cd "$replica_source"
            SOURCE_ROOT="$replica_source" \
              DIST_DIR="$replica_dist" \
              CARGO_TARGET_DIR="$replica_source/target" \
              bash scripts/build-release-archive.sh
          )
          archive="guard-${RELEASE_LABEL}-${BUILD_TARGET}.tar.gz"
          bash scripts/build-release-archive.sh --compare-archives \
            "dist/$archive" \
            "$replica_dist/$archive" \
            "$ARTIFACT_NAME" \
            "$BUILD_TARGET" \
            "$GITHUB_WORKSPACE" \
            "$replica_source"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/guard-${{ env.RELEASE_LABEL }}-${{ matrix.target }}.tar.gz

  sbom:
    name: Generate SBOM
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          cache: false
          rustflags: ""
          toolchain: 1.95.0

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Set reproducible SBOM epoch
        shell: bash
        run: |
          source_date_epoch=$(git show -s --format=%ct HEAD)
          [[ "$source_date_epoch" =~ ^[1-9][0-9]*$ ]] || {
            echo "source commit has an invalid timestamp" >&2
            exit 1
          }
          printf 'SOURCE_DATE_EPOCH=%s\n' "$source_date_epoch" >> "$GITHUB_ENV"

      # Cargo.toml declares cfg(unix)/cfg(windows) dependency sections, so the
      # dependency set differs per target. The archive builder owns the target
      # roster used by both the build matrix and these inventories.
      - name: Generate CycloneDX SBOMs
        shell: bash
        run: |
          canonicalize_sbom() {
            jq -S '
              def canonicalize_reference:
                if type == "string" then
                  sub("^path\\+file://[^#]*#guard@"; "pkg:cargo/guard@")
                else
                  .
                end;
              def stable_value:
                if type == "object" then
                  to_entries
                  | map(.value |= stable_value)
                  | sort_by(.key)
                  | from_entries
                elif type == "array" then
                  map(stable_value)
                else
                  .
                end;
              def sort_unordered:
                map(stable_value)
                | sort_by(stable_value | tojson);
              def canonicalize_bom_reference:
                if type == "object"
                  and has("bom-ref")
                  and (."bom-ref" | type) == "string"
                then
                  ."bom-ref" |= canonicalize_reference
                else
                  .
                end;
              def canonicalize_component:
                canonicalize_bom_reference
                | if (.hashes? | type) == "array" then
                    .hashes |= sort_unordered
                  else
                    .
                  end
                | if (.licenses? | type) == "array" then
                    .licenses |= sort_unordered
                  else
                    .
                  end
                | if (.externalReferences? | type) == "array" then
                    .externalReferences |= sort_unordered
                  else
                    .
                  end
                | if (.components? | type) == "array" then
                    .components |= (map(canonicalize_component) | sort_unordered)
                  else
                    .
                  end;
              def canonicalize_dependency:
                if type == "object" then
                  if has("ref") and (.ref | type) == "string" then
                    .ref |= canonicalize_reference
                  else
                    .
                  end
                  | if (.dependsOn? | type) == "array" then
                      .dependsOn |= (map(canonicalize_reference) | sort)
                    else
                      .
                    end
                else
                  .
                end;
              if (.metadata? | type) == "object"
                and (.metadata.component? | type) == "object"
                then
                  .metadata.component |= canonicalize_component
                else
                  .
                end
              | if (.metadata.authors? | type) == "array" then
                  .metadata.authors |= sort_unordered
                else
                  .
                end
              | if (.metadata.properties? | type) == "array" then
                  .metadata.properties |= sort_unordered
                else
                  .
                end
              | if (.metadata.tools? | type) == "array" then
                  .metadata.tools |= sort_unordered
                else
                  .
                end
              | if (.components? | type) == "array" then
                  .components |= (map(canonicalize_component) | sort_unordered)
                else
                  .
                end
              | if (.dependencies? | type) == "array" then
                  .dependencies |= (map(canonicalize_dependency) | sort_by(.ref))
                  else
                    .
                  end
            ' "$1"
          }

          verify_sbom_canonicalization() {
            local first="$RUNNER_TEMP/sbom-canonicalization-first.json"
            local second="$RUNNER_TEMP/sbom-canonicalization-second.json"
            local first_canonical="$RUNNER_TEMP/sbom-canonicalization-first.canonical.json"
            local second_canonical="$RUNNER_TEMP/sbom-canonicalization-second.canonical.json"
            local preserved='path+file:///stable-metadata#guard@1.2.3'

            jq -n --arg path 'path+file:///first-source#guard@1.2.3' --arg preserved "$preserved" \
              '{
                serialNumber: "urn:uuid:6aaf6be9-d7ea-4d09-abcb-ee495a0f24ea",
                metadata: {
                  timestamp: "2023-11-14T22:13:20Z",
                  component: {
                    "bom-ref": $path,
                    components: [
                      {name: "guard-main", "bom-ref": ($path + " bin-target-1")},
                      {name: "guard-lib", "bom-ref": ($path + " bin-target-0")}
                    ]
                  }
                },
                components: [
                  {name: "beta", version: "2", "bom-ref": "pkg:cargo/beta@2"},
                  {name: "alpha", version: "1", "bom-ref": "pkg:cargo/alpha@1"}
                ],
                dependencies: [
                  {ref: $path, dependsOn: ["pkg:cargo/beta@2", "pkg:cargo/alpha@1"]},
                  {ref: "pkg:cargo/beta@2", dependsOn: []}
                ],
                formulation: [{
                  workflows: [{tasks: [{steps: [{
                    commands: [{executed: "second"}, {executed: "first"}]
                  }]}]}]
                }],
                unrelated: {"bom-ref": $preserved, ref: $preserved, sequence: ["second", "first"]}
              }' \
              > "$first"
            jq -n --arg path 'path+file:///second-source#guard@1.2.3' --arg preserved "$preserved" \
              '{
                unrelated: {sequence: ["second", "first"], ref: $preserved, "bom-ref": $preserved},
                formulation: [{
                  workflows: [{tasks: [{steps: [{
                    commands: [{executed: "second"}, {executed: "first"}]
                  }]}]}]
                }],
                dependencies: [
                  {dependsOn: [], ref: "pkg:cargo/beta@2"},
                  {dependsOn: ["pkg:cargo/alpha@1", "pkg:cargo/beta@2"], ref: $path}
                ],
                components: [
                  {"bom-ref": "pkg:cargo/alpha@1", version: "1", name: "alpha"},
                  {"bom-ref": "pkg:cargo/beta@2", version: "2", name: "beta"}
                ],
                metadata: {
                  component: {
                    components: [
                      {"bom-ref": ($path + " bin-target-0"), name: "guard-lib"},
                      {"bom-ref": ($path + " bin-target-1"), name: "guard-main"}
                    ],
                    "bom-ref": $path
                  },
                  timestamp: "2023-11-14T22:13:20Z"
                },
                serialNumber: "urn:uuid:6aaf6be9-d7ea-4d09-abcb-ee495a0f24ea"
              }' \
              > "$second"
            canonicalize_sbom "$first" > "$first_canonical"
            canonicalize_sbom "$second" > "$second_canonical"
            cmp --silent "$first_canonical" "$second_canonical" || {
              echo "SBOM reference canonicalization is not path-independent" >&2
              exit 1
            }
            jq -e --arg preserved "$preserved" '
              .metadata.component."bom-ref" == "pkg:cargo/guard@1.2.3"
              and ([.metadata.component.components[].name] == ["guard-lib", "guard-main"])
              and ([.metadata.component.components[]."bom-ref"]
                == ["pkg:cargo/guard@1.2.3 bin-target-0", "pkg:cargo/guard@1.2.3 bin-target-1"])
              and ([.components[].name] == ["alpha", "beta"])
              and ([.dependencies[].ref] == ["pkg:cargo/beta@2", "pkg:cargo/guard@1.2.3"])
              and ((.dependencies[] | select(.ref == "pkg:cargo/guard@1.2.3") | .dependsOn)
                == ["pkg:cargo/alpha@1", "pkg:cargo/beta@2"])
              and ([.formulation[0].workflows[0].tasks[0].steps[0].commands[].executed]
                == ["second", "first"])
              and (.unrelated."bom-ref" == $preserved)
              and (.unrelated.ref == $preserved)
              and (.unrelated.sequence == ["second", "first"])
              and (.serialNumber == "urn:uuid:6aaf6be9-d7ea-4d09-abcb-ee495a0f24ea")
              and (.metadata.timestamp == "2023-11-14T22:13:20Z")
            ' \
              "$first_canonical" > /dev/null || {
              echo "SBOM canonicalization changed ordered or unrelated data" >&2
              exit 1
            }
          }

          verify_sbom_canonicalization

          generate_sboms() {
            local source_root="$1" output_root="$2" target sbom canonical
            mkdir -p "$output_root"
            (
              cd "$source_root"
              while IFS= read -r target; do
                cargo cyclonedx --format json --spec-version 1.5 \
                  --target "$target" \
                  --override-filename "guard-${RELEASE_LABEL}-${target}.cdx"
                sbom="guard-${RELEASE_LABEL}-${target}.cdx.json"
                jq -e '.components | map(.name) | contains(["rusqlite", "ring"])' \
                  "$sbom" > /dev/null || {
                  echo "SBOM ${sbom} is missing expected components"
                  exit 1
                }
                canonical="$output_root/$sbom"
                canonicalize_sbom "$sbom" > "$canonical"
              done < <(bash scripts/build-release-archive.sh --targets)
            )
          }

          replica_source="$RUNNER_TEMP/sbom-repro-source"
          replica_dist="$RUNNER_TEMP/sbom-repro-dist"
          git worktree add --detach "$replica_source" "$GITHUB_SHA"
          generate_sboms "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/dist"
          generate_sboms "$replica_source" "$replica_dist"
          for primary in dist/*.cdx.json; do
            replica="$replica_dist/$(basename "$primary")"
            cmp --silent "$primary" "$replica" || {
              echo "independent SBOM generations produced different output: $(basename "$primary")" >&2
              exit 1
            }
          done

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: dist/*.cdx.json
