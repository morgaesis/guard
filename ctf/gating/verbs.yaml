# Deterministic verb catalog for the consequence-gating adversarial harness.
# All verbs are `trusted` (skip the LLM) so the control-plane attacks run
# offline and deterministically. Mutations use typed Kubernetes operations
# against a local fixture whose bounded effects are directly observable.
verbs:
  - name: read-file
    description: Read the fixed seed file (reversible)
    binary: cat
    args: ["/work/seed.txt"]
    consequence: reversible
    trusted: true
    coverage:
      - name: fixture-command
        action: preauthorized

  - name: child-secret-file-contract
    description: Verify fixed-identity credential delivery remains unavailable
    binary: "true"
    consequence: reversible
    trusted: true
    coverage:
      - name: generated-file
        action: preauthorized
        environment:
          - name: CHILD_FILE_PATH
            source: secret-file
            values: ["CHILD_FILE_FIXTURE"]

  - name: child-capability-contract
    description: Verify the child identity and empty effective capability set
    binary: whoami
    args: [child-contract]
    consequence: reversible
    trusted: true
    coverage:
      - name: fixture-command
        action: preauthorized

  - name: scale-workload
    description: Scale a fixture workload; auto-reverts unless confirmed
    binary: kubectl
    args: ["scale", "deployment/{name}", "--replicas=2", "-n", "fixture"]
    params:
      name: { pattern: "^(provisional|kept|restart)$", required: true }
    consequence: recoverable
    revert: { binary: kubectl, args: ["scale", "deployment/{name}", "--replicas=1", "-n", "fixture"] }
    trusted: true
    coverage:
      - name: fixture-command
        action: preauthorized

  - name: delete-fixture-namespace
    description: Delete the fixed fixture namespace (irreversible; held)
    binary: kubectl
    args: ["delete", "namespace", "secret"]
    consequence: irreversible
    trusted: true
    coverage:
      - name: fixture-command
        action: preauthorized

  - name: kubectl-version
    description: Exercise transparent kubectl shim
    binary: kubectl
    args: ["version", "--client"]
    consequence: reversible
    trusted: true
    coverage:
      - name: fixture-command
        action: preauthorized
        cwd: /authority

  - name: helm-checked-upgrade
    description: Verify fixed identity rejects Helm profile authority before execution
    binary: helm
    args: ["upgrade", "--install", "demo", "./chart", "--namespace", "staging", "--dry-run", "--diff"]
    consequence: reversible
    trusted: true
    coverage:
      - name: fixture-command
        action: preauthorized
        cwd: /authority

  - name: ansible-ping-check
    description: Verify fixed identity rejects Ansible profile authority before execution
    binary: ansible
    args: ["web", "-m", "ping", "--check"]
    consequence: reversible
    trusted: true
    coverage:
      - name: fixture-command
        action: preauthorized
        cwd: /authority

  - name: ansible-ping-all-cwd
    description: Verify caller-owned Ansible profile discovery remains unavailable
    binary: ansible
    args: ["-m", "ping", "all"]
    consequence: reversible
    trusted: true
    coverage:
      - name: fixture-command
        action: preauthorized

  - name: ansible-playbook-check-diff
    description: Verify fixed identity rejects ansible-playbook before execution
    binary: ansible-playbook
    args: ["/work/site.yml", "--check", "--diff", "--limit", "web"]
    consequence: reversible
    trusted: true
    coverage:
      - name: fixture-command
        action: preauthorized
        cwd: /authority

  - name: failing-revert
    description: Scale a fixture whose deterministic rollback fails
    binary: kubectl
    args: ["scale", "deployment/revert-target", "--replicas=2", "-n", "fixture"]
    consequence: recoverable
    revert: { binary: "false", args: [] }
    trusted: true
    coverage:
      - name: fixture-command
        action: preauthorized

  - name: service-status
    description: Inspect one fake service through a closed command profile
    binary: printf
    args: ["fixture-service:active\\n"]
    consequence: reversible
    trusted: true

  - name: cloudstack-inventory
    description: List fake CloudStack virtual machines
    binary: printf
    args: ["fixture-vm Running\\n"]
    consequence: reversible
    trusted: true

  - name: kubernetes-list
    description: List pods through the active Guard proxy kubeconfig
    binary: kubectl
    args: ["get", "pods", "--namespace", "fixture"]
    consequence: reversible
    trusted: true

  - name: helm-list-direct
    description: Verify fixed identity rejects Helm before execution
    binary: helm
    args: ["list", "--namespace", "fixture"]
    consequence: reversible
    trusted: true

  - name: ansible-check
    description: Verify caller identity rejects ansible-playbook before execution
    binary: ansible-playbook
    args: ["/scenario/ansible/site.yml", "--check", "--diff", "--limit", "fixture"]
    consequence: reversible
    trusted: true
    coverage:
      - name: fixture-project
        action: preauthorized
        cwd: /scenario/ansible

  - name: workload-maintenance
    description: Apply a recoverable fake workload maintenance operation
    binary: kubectl
    args: ["scale", "deployment/workload-maintenance", "--replicas=2", "-n", "fixture"]
    consequence: recoverable
    revert: { binary: kubectl, args: ["scale", "deployment/workload-maintenance", "--replicas=1", "-n", "fixture"] }
    trusted: true

  - name: fixture-api-status
    description: Query a fake credential-bearing API
    binary: systemctl
    args: ["status", "fixture-api.service"]
    consequence: reversible
    trusted: true

  - name: access-service-status
    description: Inspect the fake service
    binary: printf
    args: ["fixture-service:active\\n"]
    baseline: false
    consequence: reversible
    trusted: true

  - name: access-cloudstack-inspect
    description: Inspect the fake CloudStack virtual machines
    binary: printf
    args: ["fixture-vm Running\\n"]
    baseline: false
    consequence: reversible
    trusted: true

  - name: access-kubernetes-inspect
    description: Inspect the fake Kubernetes pods
    binary: kubectl
    args: ["get", "pods", "--namespace", "access-fixture"]
    baseline: false
    consequence: reversible
    trusted: true

  - name: access-helm-inspect
    description: Exercise access approval without bypassing the Helm execution boundary
    binary: helm
    args: ["list", "--namespace", "access-fixture"]
    baseline: false
    consequence: reversible
    trusted: true

  - name: access-ansible-check
    description: Exercise access approval without bypassing the Ansible execution boundary
    binary: ansible-playbook
    args: ["/scenario/ansible/site.yml", "--check", "--diff", "--limit", "access-fixture"]
    baseline: false
    consequence: reversible
    trusted: true
    coverage:
      - name: fixture-project
        action: preauthorized
        cwd: /scenario/ansible

  - name: access-workload-maintenance
    description: Apply the fake workload maintenance operation
    binary: kubectl
    args: ["scale", "deployment/access-maintenance", "--replicas=2", "-n", "access-fixture"]
    baseline: false
    consequence: recoverable
    revert: { binary: kubectl, args: ["scale", "deployment/access-maintenance", "--replicas=1", "-n", "access-fixture"] }
    trusted: true

  - name: access-api-status
    description: Query the fake credential-backed API
    binary: systemctl
    args: ["status", "access-api.service"]
    baseline: false
    consequence: reversible
    trusted: true

  - name: access-file-read
    description: Read the fake operator file
    binary: cat
    args: ["/scenario/fixtures/operator-note"]
    baseline: false
    consequence: reversible
    trusted: true

  - name: access-command-run
    description: Run the fake bounded command
    binary: printf
    args: ["bounded-command-complete\\n"]
    baseline: false
    consequence: reversible
    trusted: true

  - name: access-missing-command
    description: Run the failing fake command
    binary: "false"
    args: []
    baseline: false
    consequence: reversible
    trusted: true

  - name: access-held-delete
    description: Delete the fake staging tree
    binary: kubectl
    args: ["delete", "namespace", "access-staging"]
    baseline: false
    consequence: irreversible
    trusted: true
