# Deterministic verb catalog for the consequence-gating adversarial harness.
# All verbs are `trusted` (skip the LLM) so the control-plane attacks run
# offline and deterministically. Each operates on files under /work so effects
# (and the exec identity that produced them) are observable.
verbs:
  - name: read-file
    description: Read a file under /work (reversible)
    binary: cat
    args: ["{path}"]
    params:
      path: { pattern: "^/work/[a-z0-9._/-]+$", required: true }
    consequence: reversible
    trusted: true

  - name: stage-file
    description: Create a file under /work; auto-reverts (removes it) unless confirmed
    binary: touch
    args: ["{path}"]
    params:
      path: { pattern: "^/work/[a-z0-9._/-]+$", required: true }
    consequence: recoverable
    revert: { binary: rm, args: ["-f", "{path}"] }
    trusted: true

  - name: wipe
    description: Recursively delete a path under /work (irreversible; held)
    binary: rm
    args: ["-rf", "{path}"]
    params:
      path: { pattern: "^/work/[a-z0-9._/-]+$", required: true }
    consequence: irreversible
    trusted: true

  - name: ssh-safe-host
    description: Exercise transparent ssh shim without caller SSH_AUTH_SOCK
    binary: ssh
    args: ["safe-host"]
    consequence: reversible
    trusted: true

  - name: kubectl-version
    description: Exercise transparent kubectl shim
    binary: kubectl
    args: ["version", "--client"]
    consequence: reversible
    trusted: true

  - name: helm-checked-upgrade
    description: Exercise a typed Helm command with cooperative dry-run/diff/target limits
    binary: helm
    args: ["upgrade", "--install", "demo", "./chart", "--namespace", "staging", "--dry-run", "--diff"]
    consequence: reversible
    trusted: true

  - name: ansible-ping-check
    description: Exercise a typed Ansible command with check mode
    binary: ansible
    args: ["web", "-m", "ping", "--check"]
    consequence: reversible
    trusted: true

  - name: ansible-ping-all-cwd
    description: Exercise Ansible inventory discovery from the caller cwd under a valid session
    binary: ansible
    args: ["-m", "ping", "all"]
    consequence: reversible
    trusted: true

  - name: ansible-playbook-check-diff
    description: Exercise an opaque playbook carrier only with check/diff/limit controls
    binary: ansible-playbook
    args: ["site.yml", "--check", "--diff", "--limit", "web"]
    consequence: reversible
    trusted: true

  - name: failing-revert
    description: Create a fixture whose deterministic rollback fails
    binary: touch
    args: ["/scenario/fixtures/revert-target"]
    consequence: recoverable
    revert: { binary: "false", args: [] }
    trusted: true

  - name: ssh-diagnose
    description: Inspect one fake SSH service through the broker
    binary: ssh
    args: ["fixture-host", "systemctl", "is-active", "fixture-service"]
    consequence: reversible
    trusted: true

  - name: cloudstack-inventory
    description: List fake CloudStack virtual machines
    binary: cloudstack
    args: ["list", "virtualmachines", "zoneid=fixture-zone"]
    consequence: reversible
    trusted: true

  - name: kubernetes-list
    description: List pods through a daemon-owned fake kubeconfig
    binary: kubectl
    args: ["get", "pods", "--namespace", "fixture"]
    consequence: reversible
    trusted: true

  - name: helm-list-direct
    description: List fake Helm releases through a typed direct path
    binary: helm
    args: ["list", "--namespace", "fixture"]
    consequence: reversible
    trusted: true

  - name: ansible-check
    description: Run one fake playbook in check mode with a bounded target
    binary: ansible-playbook
    args: ["site.yml", "--check", "--diff", "--limit", "fixture"]
    consequence: reversible
    trusted: true

  - name: host-maintenance
    description: Apply a recoverable fake host maintenance operation
    binary: hostctl
    args: ["apply", "/scenario/fixtures/maintenance-applied"]
    consequence: recoverable
    revert: { binary: rm, args: ["-f", "/scenario/fixtures/maintenance-applied"] }
    trusted: true

  - name: fixture-api-status
    description: Query a fake credential-bearing API
    binary: fixture-api
    args: ["status"]
    consequence: reversible
    trusted: true

  - name: access-ssh-inspect
    description: Inspect the fake SSH service
    binary: ssh
    args: ["fixture-host", "systemctl", "is-active", "fixture-service"]
    baseline: false
    consequence: reversible
    trusted: true

  - name: access-cloudstack-inspect
    description: Inspect the fake CloudStack virtual machines
    binary: cloudstack
    args: ["list", "virtualmachines", "zoneid=fixture-zone"]
    baseline: false
    consequence: reversible
    trusted: true

  - name: access-kubernetes-inspect
    description: Inspect the fake Kubernetes pods
    binary: kubectl
    args: ["get", "pods", "--namespace", "fixture"]
    baseline: false
    consequence: reversible
    trusted: true

  - name: access-helm-inspect
    description: Inspect the fake Helm releases
    binary: helm
    args: ["list", "--namespace", "fixture"]
    baseline: false
    consequence: reversible
    trusted: true

  - name: access-ansible-check
    description: Check the fake Ansible project
    binary: ansible-playbook
    args: ["site.yml", "--check", "--diff", "--limit", "fixture"]
    baseline: false
    consequence: reversible
    trusted: true

  - name: access-host-maintenance
    description: Apply the fake host maintenance operation
    binary: hostctl
    args: ["apply", "/scenario/fixtures/access-maintenance-applied"]
    baseline: false
    consequence: recoverable
    revert: { binary: rm, args: ["-f", "/scenario/fixtures/access-maintenance-applied"] }
    trusted: true

  - name: access-api-status
    description: Query the fake credential-backed API
    binary: fixture-api
    args: ["status"]
    baseline: false
    consequence: reversible
    trusted: true

  - name: access-file-read
    description: Read the fake operator file
    binary: cat
    args: ["/scenario/fixtures/operator-note"]
    baseline: false
    consequence: reversible
    trusted: true

  - name: access-command-run
    description: Run the fake bounded command
    binary: printf
    args: ["bounded-command-complete\\n"]
    baseline: false
    consequence: reversible
    trusted: true

  - name: access-missing-command
    description: Run the missing fake command
    binary: guard-missing-fixture-binary
    args: []
    baseline: false
    consequence: reversible
    trusted: true

  - name: access-held-delete
    description: Delete the fake staging tree
    binary: rm
    args: ["-rf", "/scenario/fixtures/staging"]
    baseline: false
    consequence: irreversible
    trusted: true
